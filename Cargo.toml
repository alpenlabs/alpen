  "crates/config",
  "crates/consensus-logic",
  "crates/csm-worker",
  "crates/csm-types",
  "crates/da-framework",
  "crates/db/types",
  "crates/db/store-sled",
  "crates/db/tests",
  "crates/key-derivation",
  "crates/ledger-types",
  "crates/node-context",
  "crates/ol/block-assembly",
  "crates/ol/chain-types",
  "crates/ol/checkpoint",
  "crates/ol/da",
  "crates/ol/mempool",
  "crates/ol/mmr-index",
  "crates/ol/msg-types",
  "crates/ol/params",
  "crates/ol/rpc/api",
  "crates/ol/rpc/types",
  "crates/ol/sequencer",
  "crates/ol/state-provider",
  "crates/ol/state-support-types",
  "crates/ol/state-types",
  "crates/ol/stf",
  "crates/paas",
  "crates/prover-core",
  "crates/bridge-params",
  "crates/primitives",
  "crates/proof-impl/checkpoint",
  "crates/proof-impl/predicate-keys",
  "crates/zkvm/hosts",
  "crates/rpc/open-rpc",
  "crates/rpc/open-rpc-macros",
  "crates/rpc/open-rpc-spec",
  "crates/snark-acct-runtime",
  "crates/snark-acct-sys",
  "crates/snark-acct-types",
  "crates/status",
  "crates/storage",
  "crates/storage-common",
  "crates/test-utils/btcio",
  "crates/test-utils/l2",
  "crates/test-utils/ssz",
  "crates/test-utils/test-utils",
  "provers/sp1",

  # binaries listed separately
  "bin/datatool",
  "bin/strata-dbtool",
  "bin/strata",
  "bin/strata-signer",
  "bin/prover-perf",

  # integration tests
  "bin/strata-test-cli",

  # benchmarks
  "benches",
]

default-members = [
  "bin/datatool",
  "bin/strata",
  "bin/strata-dbtool",
  "bin/strata-signer",
  "bin/strata-test-cli",
]

[workspace.lints]
rust.missing_debug_implementations = "warn"
rust.rust_2018_idioms = { level = "deny", priority = -1 }
rust.unreachable_pub = "warn"
rust.unused_crate_dependencies = "deny"
rust.unused_must_use = "deny"
# rust.missing_docs = "warn" # TODO(STR-3693): we need to enable this in the near future
clippy.allow_attributes = "warn"
clippy.allow_attributes_without_reason = "warn"
clippy.absolute_paths = "warn"
rustdoc.all = "warn"

