name: Security

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  supply-chain:
    name: Run `cargo-audit`
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true

      - name: Install cargo-audit
        run: cargo install cargo-audit --force --locked

        #  HACK: not denying warnings as we depend on `yaml-rust` via `format-serde-error` which is unmaintained
      - name: Check for audit warnings
        run: cargo audit -D warnings
        continue-on-error: true

      - name: Check for audit warnings (SP1 checkpoint guest)
        run: cargo audit --file provers/sp1/guest-checkpoint/Cargo.lock -D warnings
        continue-on-error: true

        # HACK: re-run without denying warnings so that we don't miss any vulnerabilities
      - name: Check for vulnerabilities
        run: cargo audit

      - name: Check for vulnerabilities (SP1 checkpoint guest)
        run: cargo audit --file provers/sp1/guest-checkpoint/Cargo.lock
