name: Security

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  supply-chain:
    name: Run `cargo-audit`
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit

        #  HACK: not denying warnings as we depend on `yaml-rust` via `format-serde-error` which is unmaintained
      - name: Check for audit warnings
        run: cargo audit -D warnings
        continue-on-error: true

      - name: Check for audit warnings (SP1 checkpoint guest)
        run: cargo audit --file provers/sp1/guest-checkpoint/Cargo.lock -D warnings
        continue-on-error: true

        # HACK: re-run without denying warnings so that we don't miss any vulnerabilities
      - name: Check for vulnerabilities
        run: cargo audit

      - name: Check for vulnerabilities (SP1 checkpoint guest)
        run: cargo audit --file provers/sp1/guest-checkpoint/Cargo.lock
