# Warns when a PR changes the SP1 checkpoint guest's verifying key (VK). The key is consensus:
# changing it after deployment needs a new OL spec. The check builds the guest at the PR base
# and at the merge commit, the same Docker way publish-sp1-artifacts.yml does and with the
# fixture runtime params, and fails when the keys differ. It is advisory: not a required check
# and not run in the merge queue.
name: Checkpoint VK guard

on:
  pull_request:
    branches:
      - main
    # The guest's inputs. The compare step fails when a local crate the guest compiles is
    # missing here.
    paths:
      - ".cargo/**"
      - ".github/actions/cleanup/**"
      - ".github/fixtures/checkpoint-runtime-params.json"
      - ".github/scripts/checkpoint_vk_guard.py"
      - ".github/scripts/sp1_artifact_publish.py"
      - ".github/workflows/checkpoint-vk-guard.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "provers/sp1/**"
      - "crates/acct-types/**"
      - "crates/bridge-params/**"
      - "crates/bridge-types/**"
      - "crates/da-framework/**"
      - "crates/ol/chain-types-v1/**"
      - "crates/ol/da-common/**"
      - "crates/ol/da-types-v1/**"
      - "crates/ol/msg-types/**"
      - "crates/ol/params/**"
      - "crates/ol/state-container/**"
      - "crates/ol/state-support-types/**"
      - "crates/ol/state-types/**"
      - "crates/ol/state-types-v1/**"
      - "crates/ol/stf/**"
      - "crates/ol/stf-v1/**"
      - "crates/ol/tx-types-v1/**"
      - "crates/proof-impl/checkpoint/**"
      - "crates/snark-acct-sys/**"
      - "crates/snark-acct-types/**"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checkpoint-vk-guard:
    name: Checkpoint VK guard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its parents: the base branch tip and the PR head.
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve commits and stage the guard scripts
        id: resolve
        run: |
          if ! git rev-parse --verify --quiet 'HEAD^2' > /dev/null; then
            echo "::error::expected the checkout to be the PR merge commit"
            exit 1
          fi
          {
            echo "head-sha=$(git rev-parse HEAD)"
            echo "base-sha=$(git rev-parse 'HEAD^1')"
          } >> "$GITHUB_OUTPUT"
          # The base commit may not have these scripts, so run them from a copy.
          mkdir -p "$RUNNER_TEMP/checkpoint-vk-guard"
          cp .github/scripts/checkpoint_vk_guard.py .github/scripts/sp1_artifact_publish.py \
            "$RUNNER_TEMP/checkpoint-vk-guard/"

      - name: Free up disk space
        uses: $/.github/actions/cleanup # zizmor: ignore[unpinned-uses]

      - name: Set up Rust toolchain
        run: |
          RUST_TOOLCHAIN=$(sed -n 's/channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # The second build reuses the first one's host and guest artifacts, so it only recompiles
      # what the PR changed.
      - name: Build guest at the merge commit
        env:
          BASE_SHA: ${{ steps.resolve.outputs.base-sha }}
          HEAD_SHA: ${{ steps.resolve.outputs.head-sha }}
        run: python3 "$RUNNER_TEMP/checkpoint-vk-guard/checkpoint_vk_guard.py" build head

      - name: Build guest at the PR base
        env:
          BASE_SHA: ${{ steps.resolve.outputs.base-sha }}
          HEAD_SHA: ${{ steps.resolve.outputs.head-sha }}
        run: python3 "$RUNNER_TEMP/checkpoint-vk-guard/checkpoint_vk_guard.py" build base

      - name: Compare verifying keys
        run: python3 "$RUNNER_TEMP/checkpoint-vk-guard/checkpoint_vk_guard.py" compare
