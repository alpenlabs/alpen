# Builds new-architecture Docker images on merge to main (or manual dispatch)
# and pushes to the shared ECR account.
#
# Generate-params and CD dispatch are tracked separately (STR-2775).

name: CI — Build and Push Images

on:
  schedule:
    - cron: '30 4,10,16,22 * * *'  # Every 6hr
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      # Only trigger when source code or Dockerfiles change
      - "bin/**"
      - "crates/**"
      - "docker/strata/**"
      - "docker/strata-checkpoint-sync/**"
      - "docker/strata-signer/**"
      - "docker/strata-datatool/**"
      - "provers/sp1/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  workflow_dispatch:
    inputs:
      # One checkbox per program — tick any subset (one, two, or all). All
      # default to true, so a plain dispatch builds everything. type:choice is
      # single-select only, hence booleans for real multi-select. Names use
      # underscores: hyphens break `inputs.x-y` (parsed as subtraction).
      strata:
        description: "Build strata (OL node)"
        type: boolean
        default: true
      strata_checkpoint_sync:
        description: "Build strata-checkpoint-sync"
        type: boolean
        default: true
      strata_signer:
        description: "Build strata-signer"
        type: boolean
        default: true
      strata_datatool:
        description: "Build strata-datatool"
        type: boolean
        default: true
      ref:
        description: "Git ref to build from (default: current branch)"
        required: false
        type: string

env:
  AWS_REGION: us-east-1

# Cancel in-progress runs for the same branch (except main — let those finish).
# Manual dispatches use unique groups so multiple requested builds can run at
# the same time.
concurrency:
  group: ci-build-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ---------------------------------------------------------------------------
  # Skip scheduled runs if no new commits since last successful build
  # ---------------------------------------------------------------------------
  check-new-commits:
    name: Check for new commits
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check for new commits since last success
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          LAST_SUCCESS=$(gh run list -R "${REPO}" \
            --workflow ci-build.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json headSha \
            --jq '.[0].headSha // ""')

          if [ "${LAST_SUCCESS}" = "${GITHUB_SHA}" ]; then
            echo "No new commits since last successful build — skipping"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "New commits found — running"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Determine which programs to build
  # ---------------------------------------------------------------------------
  prepare:
    name: Prepare build matrix
    needs: [check-new-commits]
    if: always() && (needs.check-new-commits.result == 'skipped' || needs.check-new-commits.outputs.should_run == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      short_tag: ${{ steps.resolve.outputs.short_tag }}
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Resolve actual commit SHA
        id: resolve
        env:
          BUILD_REF: ${{ inputs.ref || github.ref }}
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          SHORT_TAG="${COMMIT_SHA:0:7}"
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_tag=${SHORT_TAG}" >> "$GITHUB_OUTPUT"
          # Tag pushes already check out the event SHA. Manual backfills can also select a tag.
          tag=${BUILD_REF#refs/tags/}
          if [[ "$tag" == v* ]] && { [[ "$BUILD_REF" == refs/tags/* ]] || git tag --points-at HEAD | grep -Fxq -- "$tag"; }; then
            [[ "$tag" =~ ^v[A-Za-z0-9_.-]{1,119}$ ]] || { echo "::error::Invalid image tag $tag"; exit 1; }
            echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved commit: ${COMMIT_SHA} (tag: ${SHORT_TAG})"

      - name: Set build matrix
        id: set-matrix
        env:
          EVENT: ${{ github.event_name }}
          SEL_STRATA: ${{ inputs.strata }}
          SEL_CHECKPOINT_SYNC: ${{ inputs.strata_checkpoint_sync }}
          SEL_STRATA_SIGNER: ${{ inputs.strata_signer }}
          SEL_STRATA_DATATOOL: ${{ inputs.strata_datatool }}
        run: |
          # New architecture images only — pushed to shared ECR account.
          #
          # Single source of truth: program -> public ECR repo. An empty value
          # means private ECR only (no public mirror; e.g. strata-signer is
          # in-house — private ECR only, never mirrored public). Public repo
          # Public repo names may differ from the internal program name. To
          # publish a new program publicly, set its public_repo here — nothing
          # else changes.
          #
          # "private":false makes a program public-only — skip the private ECR
          # push entirely (e.g. strata-checkpoint-sync -> public ECR is the sole
          # canonical image registry; STR-3962). Defaults to true when omitted.
          PROGRAM_CONFIG='{
            "strata":                 {"public_repo":"strata"},
            "strata-checkpoint-sync": {"public_repo":"strata-checkpoint-sync","private":false},
            "strata-signer":          {"public_repo":""},
            "strata-datatool":        {"public_repo":""}
          }'
          ALL='["strata","strata-checkpoint-sync","strata-signer","strata-datatool"]'

          if [ "$EVENT" != "workflow_dispatch" ]; then
            # Scheduled / push builds every program.
            PROGRAMS="$ALL"
          else
            # Manual dispatch: one checkbox per program, all default true, so a
            # plain dispatch builds all. Include each ticked program.
            SEL=()
            if [ "$SEL_STRATA" = "true" ];          then SEL+=( '"strata"' ); fi
            if [ "$SEL_CHECKPOINT_SYNC" = "true" ]; then SEL+=( '"strata-checkpoint-sync"' ); fi
            if [ "$SEL_STRATA_SIGNER" = "true" ];   then SEL+=( '"strata-signer"' ); fi
            if [ "$SEL_STRATA_DATATOOL" = "true" ]; then SEL+=( '"strata-datatool"' ); fi
            PROGRAMS="[$(IFS=,; echo "${SEL[*]}")]"
          fi

          # Emit an include-only matrix so each job carries its program and the
          # public_repo it maps to. Unknown programs default to private-only.
          MATRIX=$(jq -cn \
            --argjson progs "$PROGRAMS" \
            --argjson cfg "$PROGRAM_CONFIG" \
            '{include: ($progs | map({program: ., private: true} + ($cfg[.] // {public_repo: ""})))}')
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "Building: $PROGRAMS"

  # ---------------------------------------------------------------------------
  # Build and push each program in parallel
  # ---------------------------------------------------------------------------
  build-and-push:
    name: "Build ${{ matrix.program }}"
    needs: [prepare]
    # check-new-commits is skipped on push and dispatch. Without a status
    # function, the implicit success() sees that skip and skips this job too.
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    environment: prod
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    concurrency:
      group: ci-image-${{ matrix.program }}-${{ needs.prepare.outputs.short_tag }}
      queue: max
    steps:
      # Authenticate to the shared ECR account
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        env:
          ROLE_ARN: ${{ secrets.SHARED_ECR_ROLE_ARN }}
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: matrix.private
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
        with:
          mask-password: "true"

      # Public ECR is a distinct registry (public.ecr.aws) with its own auth
      # token, which must be requested from us-east-1. The same assumed role
      # (SHARED_ECR_ROLE_ARN) is authorized to push the public node images —
      # see alpen-infra github-actions-image-push (STR-3894). Only the programs
      # published publicly need this login.
      - name: Login to Amazon ECR Public
        if: matrix.public_repo != ''
        run: |
          aws ecr-public get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin public.ecr.aws

      - name: Check for published images
        id: images
        env:
          PRIVATE_REPO: ${{ steps.login-ecr.outputs.registry }}/${{ vars.SHARED_ECR_REPOSITORY_PREFIX }}/${{ matrix.program }}
          PUSH_PRIVATE: ${{ matrix.private }}
          PUBLIC_REPO: ${{ matrix.public_repo }}
          SHORT_TAG: ${{ needs.prepare.outputs.short_tag }}
          COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}
        run: |
          images=()
          if [[ "$PUSH_PRIVATE" == true ]]; then
            images+=("$PRIVATE_REPO:$SHORT_TAG")
          fi
          if [[ -n "$PUBLIC_REPO" ]]; then
            images+=("public.ecr.aws/alpenlabs/$PUBLIC_REPO:$SHORT_TAG")
          fi
          if (( ${#images[@]} == 0 )); then
            echo "::error::No image registry configured"
            exit 1
          fi

          if [[ -n "$RELEASE_TAG" ]]; then
            for image in "${images[@]}"; do
              images+=("${image%:*}:$RELEASE_TAG-$SHORT_TAG")
            done
          fi

          source_image=
          missing=()
          for image in "${images[@]}"; do
            if metadata=$(skopeo inspect --no-tags "docker://$image" 2>"$RUNNER_TEMP/inspect.err"); then
              revision=$(jq -r '.Labels["org.opencontainers.image.revision"]' <<< "$metadata")
              if [[ "$revision" != "$COMMIT_SHA" ]]; then
                echo "::error::$image belongs to revision $revision, expected $COMMIT_SHA"
                exit 1
              fi
              digest=$(jq -er '.Digest' <<< "$metadata")
              if [[ -n "$source_image" && "${source_image##*@}" != "$digest" ]]; then
                echo "::error::Conflicting published digests for $image and $source_image"
                exit 1
              fi
              source_image="docker://${image%:*}@$digest"
              echo "Found $image ($digest)"
            elif grep -qi 'manifest unknown' "$RUNNER_TEMP/inspect.err"; then
              missing+=("$image")
            else
              cat "$RUNNER_TEMP/inspect.err" >&2
              exit 1
            fi
          done

          if [[ -z "$source_image" ]]; then
            echo "build_tags=${images[*]}" >> "$GITHUB_OUTPUT"
          else
            for image in "${missing[@]}"; do
              skopeo copy --all --preserve-digests "$source_image" "docker://$image"
            done
          fi

      - name: Checkout repository
        if: steps.images.outputs.build_tags != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          persist-credentials: false

      - name: Free up disk space
        if: steps.images.outputs.build_tags != ''
        uses: $/.github/actions/cleanup

      - name: Set up Docker Buildx
        if: steps.images.outputs.build_tags != ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false

      - name: Build and push Docker image
        if: steps.images.outputs.build_tags != ''
        env:
          IMAGES: ${{ steps.images.outputs.build_tags }}
          COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}
          PROGRAM: ${{ matrix.program }}
        run: |
          DOCKERFILE_PATH="docker/${PROGRAM}/Dockerfile"
          read -ra images <<< "$IMAGES"
          TAGS=()
          for image in "${images[@]}"; do
            TAGS+=(-t "$image")
          done

          # Bake prover features into the strata image. Other programs build
          # with default features. Relies on docker/strata/Dockerfile accepting
          # the CARGO_FEATURES build arg (#1663).
          BUILD_ARGS=()
          if [[ -n "$RELEASE_TAG" ]]; then
            BUILD_ARGS+=( --label "org.opencontainers.image.version=$RELEASE_TAG" )
          fi
          if [ "$PROGRAM" = "strata" ]; then
            BUILD_ARGS+=( --build-arg "CARGO_FEATURES=sp1,prover" )
          fi

          # Single build, multiple tags: buildx pushes to both the private and
          # public registries from one image (same digest in both).
          docker buildx build \
            "${BUILD_ARGS[@]}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${COMMIT_SHA}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --push \
            "${TAGS[@]}" \
            -f "${DOCKERFILE_PATH}" .

          echo "Successfully pushed ${IMAGES}"

  # ---------------------------------------------------------------------------
  # Summary
  # ---------------------------------------------------------------------------
  summary:
    name: Build Summary
    needs: [prepare, build-and-push]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report results
        env:
          SHORT_TAG: ${{ needs.prepare.outputs.short_tag }}
          COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}
          BUILD_RESULT: ${{ needs.build-and-push.result }}
        run: |
          {
            echo "## Build Summary"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| **Commit** | \`${COMMIT_SHA}\` |"
            echo "| **Image Tag** | \`${SHORT_TAG}\` |"
            echo "| **Ref** | \`${GITHUB_REF_NAME}\` |"
            echo ""
            echo "### Build Status"
            echo "Overall: **${BUILD_RESULT}**"
          } >> "$GITHUB_STEP_SUMMARY"
