name: Publish SP1 Artifacts

on:
  workflow_dispatch:
    inputs:
      env:
        description: Deployment network recorded in the manifest.
        required: true
        type: choice
        options:
          - dev
          - staging
          - testnet
          - mainnet
      ref:
        description: Commit, tag, or branch to build. Run the workflow itself from main.
        required: true
        default: main
        type: string
      checkpoint_runtime_params_url:
        description: HTTPS download URL for full OL params or bare runtime params (raw URL, not a GitHub /blob/ page).
        required: true
        type: string
  workflow_call:
    inputs:
      env:
        description: Deployment network (dev | staging | testnet | mainnet).
        required: true
        type: string
      ref:
        description: Commit, tag, or branch to build.
        required: false
        default: main
        type: string
      checkpoint_runtime_params_url:
        description: HTTPS download URL for full OL params or bare runtime params.
        required: true
        type: string

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  CARGO_TERM_COLOR: always
  # Cluster readers and the publish role share the elfs/ prefix.
  S3_BUCKET: alpen-mosaic-artifacts
  S3_PREFIX: elfs/alpen

concurrency:
  group: publish-sp1-artifacts-${{ inputs.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build-sp1-artifacts:
    name: Build SP1 artifacts
    # Keep the workflow, helpers, and local actions on main; only guest-source varies.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.summarize.outputs.version }}
    permissions:
      contents: read
    steps:
      - name: Checkout publishing scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate inputs
        env:
          INPUT_ENV: ${{ inputs.env }}
          CHECKPOINT_RUNTIME_PARAMS_URL: ${{ inputs.checkpoint_runtime_params_url }}
        run: python3 .github/scripts/sp1_artifact_publish.py validate

      - name: Fetch checkpoint runtime params
        env:
          CHECKPOINT_RUNTIME_PARAMS_URL: ${{ inputs.checkpoint_runtime_params_url }}
          CHECKPOINT_RUNTIME_PARAMS_PATH: ${{ runner.temp }}/checkpoint-runtime-params.json
        run: python3 .github/scripts/sp1_artifact_publish.py fetch

      - name: Checkout guest source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          path: guest-source
          persist-credentials: false

      - name: Resolve guest commit and SP1 versions
        id: resolve-build
        env:
          SOURCE_DIR: guest-source
        run: python3 .github/scripts/sp1_artifact_publish.py resolve-build

      - name: Free up disk space
        uses: ./.github/actions/cleanup # zizmor: ignore[self-repository]

      - name: Set up Rust toolchain
        run: |
          RUST_TOOLCHAIN=$(sed -n 's/channel = "\(.*\)"/\1/p' guest-source/rust-toolchain.toml)
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: guest-source -> target
          cache-on-failure: true

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install SP1 core runner override
        uses: ./.github/actions/sp1-core-runner-override # zizmor: ignore[self-repository,unpinned-uses]
        with:
          version: ${{ steps.resolve-build.outputs.sp1_runner_version }}

      - name: Install SP1 toolchain
        env:
          SP1_VERSION: ${{ steps.resolve-build.outputs.sp1_version }}
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 https://sp1.succinct.xyz | bash
          ~/.sp1/bin/sp1up -v "$SP1_VERSION" -c
          echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"

      - name: Verify SP1 toolchain
        run: cargo prove --version

      - name: Build SP1 guest artifacts
        working-directory: guest-source
        env:
          BUILD_ELF: "1"
          BUILD_VKEY: "1"
          CHECKPOINT_RUNTIME_PARAMS_PATH: ${{ runner.temp }}/checkpoint-runtime-params.json
        run: cargo build --locked -p strata-sp1-guest-builder --features docker-build --release

      - name: Verify artifacts and emit traceability summary
        id: summarize
        env:
          ARTIFACT_DIR: artifacts/sp1
          ELF_ROOT: guest-source/provers/sp1/generated
          DEPLOY_ENV: ${{ inputs.env }}
          ALPEN_REF: ${{ inputs.ref }}
          ALPEN_SHA: ${{ steps.resolve-build.outputs.sha }}
          SP1_VERSION: ${{ steps.resolve-build.outputs.sp1_version }}
          CHECKPOINT_RUNTIME_PARAMS_URL: ${{ inputs.checkpoint_runtime_params_url }}
          CHECKPOINT_RUNTIME_PARAMS_PATH: ${{ runner.temp }}/checkpoint-runtime-params.json
        run: python3 .github/scripts/sp1_artifact_publish.py summarize

      - name: Upload artifacts as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sp1-artifacts-${{ steps.summarize.outputs.version }}
          path: artifacts/sp1/
          if-no-files-found: error
          retention-days: 90

  publish-sp1-artifacts:
    name: Publish SP1 artifacts
    runs-on: ubuntu-latest
    needs: build-sp1-artifacts
    timeout-minutes: 15
    # Required: the S3 role trusts only the OIDC subject
    # repo:alpenlabs/alpen:environment:sp1-artifacts. The environment carries
    # required reviewers and a main-only branch policy, gating every publish.
    environment: sp1-artifacts
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout publishing scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download SP1 artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sp1-artifacts-${{ needs.build-sp1-artifacts.outputs.version }}
          path: artifacts/sp1/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::496607027995:role/github-actions-alpen-sp1-s3
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload SP1 artifacts to S3
        id: upload
        env:
          ARTIFACT_DIR: artifacts/sp1
          S3_BUCKET: ${{ env.S3_BUCKET }}
          S3_PREFIX: ${{ env.S3_PREFIX }}
        run: python3 .github/scripts/sp1_artifact_publish.py upload
