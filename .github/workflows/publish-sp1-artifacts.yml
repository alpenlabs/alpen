name: Publish SP1 Artifacts

on:
  workflow_dispatch:
    inputs:
      env:
        description: Deployment environment. Prefixes the S3 version segment.
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
  workflow_call:
    inputs:
      env:
        description: Deployment environment (dev | staging | prod).
        required: true
        type: string

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  CARGO_TERM_COLOR: always
  # Central artifact bucket (shared-services). The publish role below is
  # prefix-scoped to sp1-artifacts/* — see alpen-infra
  # aws/shared-services/us-east-1/shared/iam/github-actions-alpen-sp1-s3.
  S3_BUCKET: alpen-mosaic-artifacts
  S3_PREFIX: sp1-artifacts
  SP1_VERSION: v6.1.0

concurrency:
  group: publish-sp1-artifacts-${{ inputs.env }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build-sp1-artifacts:
    name: Build SP1 artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.summarize.outputs.version }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve checked-out commit
        id: resolve-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate inputs
        env:
          INPUT_ENV: ${{ inputs.env }}
        run: python3 .github/scripts/sp1_artifact_publish.py validate

      - name: Free up disk space
        uses: ./.github/actions/cleanup # zizmor: ignore[self-repository]

      - name: Set up Rust toolchain
        run: |
          RUST_TOOLCHAIN=$(sed -n 's/channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          cache-on-failure: true

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install SP1 core runner override
        uses: ./.github/actions/sp1-core-runner-override # zizmor: ignore[self-repository,unpinned-uses]

      - name: Install SP1 toolchain
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 https://sp1.succinct.xyz | bash
          ~/.sp1/bin/sp1up -v "$SP1_VERSION" -c
          echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"

      - name: Verify SP1 toolchain
        run: cargo prove --version

      - name: Build SP1 guest artifacts
        env:
          ZKVM_MOCK: "0"
        run: |
          case "${ZKVM_MOCK,,}" in
            1|true)
              echo "::error::ZKVM_MOCK must not be enabled for published SP1 artifacts"
              exit 1
              ;;
          esac
          cargo build --locked -p strata-sp1-guest-builder --features docker-build --release

      - name: Verify artifacts and emit traceability summary
        id: summarize
        env:
          ARTIFACT_DIR: artifacts/sp1
          CACHE_ROOT: provers/sp1
          DEPLOY_ENV: ${{ inputs.env }}
          ALPEN_REF: ${{ github.ref }}
          ALPEN_SHA: ${{ steps.resolve-sha.outputs.sha }}
          SP1_VERSION: ${{ env.SP1_VERSION }}
          ZKVM_MOCK: "0"
        run: python3 .github/scripts/sp1_artifact_publish.py summarize

      - name: Upload artifacts as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sp1-artifacts-${{ steps.summarize.outputs.version }}
          path: artifacts/sp1/
          if-no-files-found: error
          retention-days: 90

  publish-sp1-artifacts:
    name: Publish SP1 artifacts
    runs-on: ubuntu-latest
    needs: build-sp1-artifacts
    timeout-minutes: 15
    # Required: the S3 role trusts only the OIDC subject
    # repo:alpenlabs/alpen:environment:sp1-artifacts. The environment carries
    # required reviewers and a main-only branch policy, gating every publish.
    environment: sp1-artifacts
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download SP1 artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sp1-artifacts-${{ needs.build-sp1-artifacts.outputs.version }}
          path: artifacts/sp1/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: arn:aws:iam::496607027995:role/github-actions-alpen-sp1-s3
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload SP1 artifacts to S3
        id: upload
        env:
          ARTIFACT_DIR: artifacts/sp1
          S3_BUCKET: ${{ env.S3_BUCKET }}
          S3_PREFIX: ${{ env.S3_PREFIX }}
        run: python3 .github/scripts/sp1_artifact_publish.py upload
