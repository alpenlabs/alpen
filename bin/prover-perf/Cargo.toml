[package]
edition = "2021"
name = "strata-provers-perf"
version = "0.3.0-alpha.1"

[lints]
workspace = true

[dependencies]
zkaleido.workspace = true

# proof programs
strata-proofimpl-checkpoint.workspace = true

strata-acct-types.workspace = true
strata-identifiers.workspace = true
strata-ol-params = { workspace = true, features = ["test-defaults"] }
strata-ol-state-support-types.workspace = true
strata-ol-stf-v1 = { workspace = true, features = ["test-utils"] }
strata-predicate.workspace = true
strata-proofimpl-predicate-keys = { workspace = true, features = ["sp1"] }
strata-zkvm-hosts.workspace = true

# sp1
sp1-sdk.workspace = true
zkaleido-sp1-host = { workspace = true, optional = true }

anyhow.workspace = true
argh.workspace = true
num-format = "0.4.4"
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
strata-codec.workspace = true
strata-ol-da-types-v1.workspace = true
strata-ol-state-types.workspace = true

[features]
default = ["sp1"]
sp1 = [
  "zkaleido-sp1-host/perf",
  "strata-zkvm-hosts/sp1-builder",
  "dep:zkaleido-sp1-host",
]
