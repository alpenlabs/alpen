# Regtest example; deploy the network's trusted execution-parameters file.
# Relative paths resolve against this TOML file, independently of the working directory.
asm_execution = "docker/configs/asm-execution-params.json"

[client]
rpc_host = "127.0.0.1"
rpc_port = 8432
admin_rpc_host = "127.0.0.1"
admin_rpc_port = 8434
admin_rpc_bearer_token = "dev-only-change-me"
l2_blocks_fetch_limit = 1_000
datadir = "/path/to/data/directory"
# sequencer_key = "/path/to/data/directory/"
# sequencer_bitcoin_address = ""
db_retry_count = 5
max_headers_range = 5_000

[logging]
metrics_port = 9615

[bitcoind]
rpc_url = "localhost:18332"
rpc_user = "alpen"
rpc_password = "alpen"
network = "regtest"

[btcio.reader]
client_poll_dur_ms = 200

[btcio.writer]
write_poll_dur_ms = 200
fee_policy = "mempool"
# Required when fee_policy = "mempool"
# mempool_base_url = "https://mempool.space"
# Optional when fee_policy = "mempool"
# mempool_fee_policy = "economy"
# Optional when fee_policy = "mempool"
# mempool_fallback_conf_target = 6
# Optional when fee_policy = "bitcoind"
# bitcoind_conf_target = 6
# Required when fee_policy = "fixed" (sat/vB; fractional values allowed)
# fixed_fee_rate = 0.5
mempool_base_url = "https://mempool.space"
reveal_amount = 100

bundle_interval_ms = 500

[btcio.broadcaster]
poll_interval_ms = 5_000
