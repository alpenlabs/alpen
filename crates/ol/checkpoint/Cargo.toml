[package]
name = "strata-ol-checkpoint"
version = "0.1.0"
edition = "2024"
description = "OL checkpoint lifecycle services"
publish = false

[features]
sequencer = [
  "dep:async-trait",
  "dep:bitcoin",
  "dep:strata-asm-proto-checkpoint-txs",
  "dep:strata-btc-types",
  "dep:strata-btcio",
  "dep:strata-codec",
  "dep:strata-codec-utils",
  "dep:strata-csm-types",
  "dep:strata-l1-envelope-fmt",
  "dep:strata-l1-txfmt",
]

[dependencies]
anyhow.workspace = true
async-trait = { workspace = true, optional = true }
bitcoin = { workspace = true, optional = true }
metrics.workspace = true
serde.workspace = true
strata-asm-checkpoint-types.workspace = true
strata-asm-common.workspace = true
strata-asm-proto-checkpoint.workspace = true
strata-asm-proto-checkpoint-txs = { workspace = true, optional = true }
strata-bridge-params.workspace = true
strata-btc-types = { workspace = true, optional = true }
strata-btcio = { workspace = true, optional = true }
strata-checkpoint-types.workspace = true
strata-codec = { workspace = true, optional = true }
strata-codec-utils = { workspace = true, optional = true }
strata-csm-types = { workspace = true, optional = true }
strata-db-types.workspace = true
strata-identifiers.workspace = true
strata-l1-envelope-fmt = { workspace = true, optional = true }
strata-l1-txfmt = { workspace = true, optional = true }
strata-node-context.workspace = true
strata-ol-chain-types-v1.workspace = true
strata-ol-state-support-types.workspace = true
strata-ol-state-types-v1.workspace = true
strata-ol-stf-v1.workspace = true
strata-primitives.workspace = true
strata-service.workspace = true
strata-storage.workspace = true
strata-tasks.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[lints]
workspace = true

[dev-dependencies]
proptest.workspace = true
strata-acct-types.workspace = true
strata-asm-checkpoint-types = { workspace = true, features = ["test-utils"] }
strata-asm-proto-txs-test-utils.workspace = true
strata-bridge-params = { workspace = true, features = ["test-defaults"] }
strata-db-store-sled.workspace = true
strata-identifiers = { workspace = true, features = ["test-utils"] }
strata-ol-state-types.workspace = true
strata-ol-stf-v1 = { workspace = true, features = ["test-utils"] }
strata-ol-tx-types-v1.workspace = true
strata-storage = { workspace = true, features = ["test-utils"] }
